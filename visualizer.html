<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A* Algorithm Math Visualizer</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }
        canvas {
            background-color: #313244;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        button {
            background-color: #a6e3a1;
            color: #11111b;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #94e2d5; }
        .instructions {
            max-width: 800px;
            text-align: center;
            margin-top: 10px;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>🧠 A* Formula (f = g + h) Visualizer</h1>
    
    <div class="controls">
        <button onclick="nextStep()">Next Step: Calculate Math</button>
        <button onclick="reset()">Reset</button>
    </div>

    <canvas id="astarCanvas" width="900" height="600"></canvas>
    
    <div class="instructions" id="explanationText">
        Click "Next Step" to see how the engine calculates costs for different zone types.
    </div>

    <script>
        const canvas = document.getElementById('astarCanvas');
        const ctx = canvas.getContext('2d');
        const explanationText = document.getElementById('explanationText');

        // Define the nodes with their respective A* values
        const nodes = {
            "start": { x: 150, y: 275, label: "Start Hub", color: "#a6e3a1", g: 0, h: 3.0 },
            "priority": { x: 450, y: 100, label: "Priority (Cost: 0.9)", color: "#cba6f7", g: 0.9, h: 2.0 },
            "normal": { x: 450, y: 275, label: "Normal (Cost: 1.0)", color: "#89b4fa", g: 1.0, h: 2.0 },
            "restricted": { x: 450, y: 450, label: "Restricted (Cost: 2.0)", color: "#f38ba8", g: 2.0, h: 2.0 },
            "end": { x: 750, y: 275, label: "End Hub", color: "#f9e2af", g: "?", h: 0.0 }
        };

        const edges = [
            ["start", "priority"],
            ["start", "normal"],
            ["start", "restricted"],
            ["priority", "end"],
            ["normal", "end"],
            ["restricted", "end"]
        ];

        let step = 0;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw connecting wires
            ctx.strokeStyle = "#585b70";
            ctx.lineWidth = 4;
            edges.forEach(([n1, n2]) => {
                ctx.beginPath();
                ctx.moveTo(nodes[n1].x, nodes[n1].y);
                ctx.lineTo(nodes[n2].x, nodes[n2].y);
                ctx.stroke();
            });

            // Draw nodes and math
            for (const [key, n] of Object.entries(nodes)) {
                ctx.beginPath();
                ctx.arc(n.x, n.y, 30, 0, Math.PI * 2);
                ctx.fillStyle = n.color;
                ctx.fill();
                ctx.strokeStyle = "#11111b";
                ctx.lineWidth = 3;
                ctx.stroke();

                // Draw Room Labels
                ctx.fillStyle = "#cdd6f4";
                ctx.font = "bold 16px monospace";
                ctx.textAlign = "center";
                ctx.fillText(n.label, n.x, n.y - 45);

                // Reveal math step-by-step
                if (step > 0 && key !== "start" && key !== "end") {
                    ctx.fillStyle = "#bac2de";
                    ctx.font = "16px monospace";
                    ctx.fillText(`g: +${n.g.toFixed(1)} (Travel)`, n.x, n.y + 55);
                }
                if (step > 1 && key !== "start" && key !== "end") {
                    ctx.fillText(`h: +${n.h.toFixed(1)} (Radar)`, n.x, n.y + 75);
                }
                if (step > 2 && key !== "start" && key !== "end") {
                    ctx.fillStyle = "#a6e3a1";
                    ctx.font = "bold 20px monospace";
                    ctx.fillText(`f = ${(n.g + n.h).toFixed(1)}`, n.x, n.y + 105);
                }
                
                // Highlight the winning path in the priority queue
                if (step > 3 && key === "priority") {
                    ctx.strokeStyle = "#a6e3a1";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(n.x - 70, n.y + 80, 140, 35);
                    
                    // Draw simulated drone choice
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 12, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffffff";
                    ctx.fill();
                }
            }
            
            // Update explanatory text
            if (step === 0) explanationText.innerHTML = "<strong>Step 1:</strong> The Drone stands at the Start Hub and looks at all connected rooms.";
            if (step === 1) explanationText.innerHTML = "<strong>Step 2:</strong> It calculates the <strong>$g$ score</strong> (the time it takes to travel there). Priority takes 0.9, Normal takes 1.0, Restricted takes 2.0.";
            if (step === 2) explanationText.innerHTML = "<strong>Step 3:</strong> It adds the <strong>$h$ score</strong> (the pre-calculated heuristic distance to the End Hub).";
            if (step === 3) explanationText.innerHTML = "<strong>Step 4:</strong> It calculates the final A* formula: <strong>$f = g + h$</strong>.";
            if (step === 4) explanationText.innerHTML = "<strong>Step 5:</strong> The Priority Queue (heapq) automatically pops the path with the lowest $f$ score (2.9). The drone chooses the Priority lane!";
        }

        function nextStep() {
            if (step < 4) {
                step++;
                draw();
            }
        }

        function reset() {
            step = 0;
            draw();
        }

        draw(); // Initial render
    </script>
</body>
</html>
